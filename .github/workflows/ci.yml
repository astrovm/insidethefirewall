name: PR validation

on:
  # Every pull request, including ones stacked on other branches.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and unit tests
        run: bun run test
      - name: Check docs/ matches the source
        run: |
          bun run build
          git add --intent-to-add docs
          git diff --exit-code --stat -- docs || { echo "::error::docs/ is out of date. Run 'bun run build' and commit it."; exit 1; }
      - name: Validate HTML, JavaScript and local assets
        run: python .github/scripts/validate-static.py docs
      - name: Test static validation regressions
        run: python .github/scripts/test-validate-static.py
      - name: Install browser smoke-test dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ci-venv
        run: |
          uv sync --locked --project .github --only-group ci --python "$(command -v python)"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m playwright install --with-deps chromium
      - name: Play the game in Chromium
        run: python .github/scripts/e2e-game.py

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - validate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
