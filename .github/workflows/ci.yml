name: PR validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate game
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate HTML, JavaScript and local assets
        run: python .github/scripts/validate-static.py docs
      - name: Test static validation regressions
        run: python .github/scripts/test-validate-static.py
      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Load the exported game in Chromium
        run: python .github/scripts/smoke-game.py
